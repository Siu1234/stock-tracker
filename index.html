<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stocks">
  <meta name="description" content="Personal stock & deposit tracker — mobile first, data stays on your device.">
  <title>Stock Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="view" class="view" role="main" aria-busy="true"></main>

    <nav class="tabbar" aria-label="Main">
      <button class="tab" data-tab="portfolio" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
        Home
      </button>
      <button class="tab" data-tab="transactions" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 4h14M7 10h14M7 16h14"/><circle cx="3.2" cy="4" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.2" cy="10" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.2" cy="16" r="1.3" fill="currentColor" stroke="none"/></svg>
        Trades
      </button>
      <button class="tab" data-tab="deposits" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="14" rx="2.5"/><path d="M17 12.5h4.5V9.5H5.5"/><path d="M2.5 9.5 8 6h12v3.5"/></svg>
        Deposits
      </button>
      <button class="tab" data-tab="settings" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4L9.9 5.5a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.1 2.5h4l.1-2.5a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5A7 7 0 0 0 19 12Z"/></svg>
        Settings
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-xlsx" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <input type="file" id="file-json" accept=".json,application/json" hidden>

  <script src="vendor/xlsx.full.min.js"></script>
  <script>
    // Fallback: if the bundled copy is missing (it shouldn't be), try the CDN.
    if (typeof XLSX === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js"><\/script>');
    }
  </script>
  <script src="js/seed.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
